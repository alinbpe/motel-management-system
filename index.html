
<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="سامانه هوشمند مدیریت متل" />
    <title>مدیریت هوشمند متل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
              }
            },
            borderRadius: {
              '4xl': '2.5rem',
              '5xl': '3.5rem',
            }
          }
        }
      }
    </script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
      body {
        font-family: 'Vazirmatn', -apple-system, sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }
      .dark body { background-color: #020617; color: #f8fafc; }
      .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      .dark .glass { background: rgba(15, 23, 42, 0.7); border-color: rgba(255, 255, 255, 0.1); }
      @keyframes pulse-ring { 0% { transform: scale(.33); } 80%, 100% { opacity: 0; } }
      .voice-ring:before { content: ''; position: absolute; width: 100%; height: 100%; border: 4px solid #6366f1; border-radius: 50%; animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.95.3",
        "react": "https://esm.sh/react@^19.2.4",

      }
    }
    </script>

    <div id="root"></div>
  </body>
